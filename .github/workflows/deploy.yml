# Publishes the game to Cloudflare Pages.
#
# There is no build step — the repository root is the site — so this only has to
# copy the static files out and hand them to Cloudflare. Everything under
# `node_modules`, `tools` and `docs` stays behind; the PDF is the one thing in
# `docs` worth serving.
#
# Needs two repository secrets (Settings -> Secrets and variables -> Actions):
#
#   CLOUDFLARE_API_TOKEN    an API token with Account -> Cloudflare Pages -> Edit
#   CLOUDFLARE_ACCOUNT_ID   Workers & Pages -> the account ID in the sidebar
#
# Without them the job skips instead of failing, so a fork or a fresh clone does
# not show a permanently red tick.

name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
      - claude/idle-game-museum-artifacts-7vyho2
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set — skipping deploy."
          fi

      - name: Assemble the site
        if: steps.creds.outputs.ready == 'true'
        run: |
          mkdir -p _site/docs
          cp index.html styles.css _site/
          cp -r src _site/
          cp docs/Site7-Deep-Survey-Design.pdf _site/docs/ 2>/dev/null || true
          cp docs/DESIGN.md _site/docs/ 2>/dev/null || true
          # A 404 that is the game is friendlier than a 404 that is a 404.
          cp index.html _site/404.html

      - name: Publish
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=site7-deep-survey --branch=${{ github.ref_name }}
